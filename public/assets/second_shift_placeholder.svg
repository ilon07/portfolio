<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#121829" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)" />

  <!-- Subtle grid lines -->
  <g stroke="#1e293b" stroke-width="1" opacity="0.4">
    <line x1="0" y1="75" x2="800" y2="75" />
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="225" x2="800" y2="225" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="375" x2="800" y2="375" />
    <line x1="100" y1="0" x2="100" y2="450" />
    <line x1="200" y1="0" x2="200" y2="450" />
    <line x1="300" y1="0" x2="300" y2="450" />
    <line x1="400" y1="0" x2="400" y2="450" />
    <line x1="500" y1="0" x2="500" y2="450" />
    <line x1="600" y1="0" x2="600" y2="450" />
    <line x1="700" y1="0" x2="700" y2="450" />
  </g>

  <!-- Card Border -->
  <rect x="40" y="30" width="720" height="390" rx="12" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6 6" />

  <!-- Central Icon (Relay Server & Keystream XOR) -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <!-- Server Stack -->
    <rect x="-70" y="-55" width="140" height="32" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="url(#glow)"/>
    <circle cx="-45" cy="-39" r="4" fill="#22c55e" />
    <circle cx="-30" cy="-39" r="4" fill="#38bdf8" />
    <line x1="0" y1="-39" x2="45" y2="-39" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <rect x="-70" y="-15" width="140" height="32" rx="6" fill="#1e293b" stroke="#0ea5e9" stroke-width="2" />
    <circle cx="-45" cy="1" r="4" fill="#22c55e" />
    <circle cx="-30" cy="1" r="4" fill="#0ea5e9" />
    <line x1="0" y1="1" x2="45" y2="1" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <rect x="-70" y="25" width="140" height="32" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="2" />
    <circle cx="-45" cy="41" r="4" fill="#eab308" />
    <circle cx="-30" cy="41" r="4" fill="#6366f1" />
    <line x1="0" y1="41" x2="45" y2="41" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>

    <!-- XOR symbol -->
    <circle cx="115" cy="1" r="20" fill="#0f172a" stroke="#f43f5e" stroke-width="2" />
    <text x="115" y="8" font-family="monospace" font-size="20" font-weight="bold" fill="#f43f5e">⊕</text>
  </g>

  <!-- Labels -->
  <g text-anchor="middle">
    <text x="400" y="275" font-family="'Inter', sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="1">
      SECOND SHIFT: RELAY TRANSMISSIONS
    </text>
    <text x="400" y="305" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" fill="#38bdf8">
      relay-heartbeat.enc · relay-heartbeat.json · relay-tasking.enc
    </text>
    <text x="400" y="340" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">
      Known-Plaintext CTR Keystream Reuse Attack Placeholder
    </text>
    <rect x="300" y="360" width="200" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="400" y="379" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">
      ARTIFACT PLACEHOLDER
    </text>
  </g>
</svg>
